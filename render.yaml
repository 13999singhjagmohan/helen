# Blueprint for one-click deploy on Render. Check Render's acceptable use policy for adult content first.
services:
  - type: web
    name: helen
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: node src/server.js
    disk:
      name: helen-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: Helen
      - key: LLM_PROVIDER
        value: openai-compatible
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: PROVIDER_ALLOWS_EXPLICIT
        value: "false"
